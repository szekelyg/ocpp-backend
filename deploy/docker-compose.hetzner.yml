# Hetzner (ubuntu-4gb-nbg1-1) – a 80/443-at a flexibox-caddy foglalja, ezért itt nincs Caddy.
# A TLS-t és a publikus elérést a Cloudflare tunnel adja (ugyanaz a tunnel, mint a Mac minin volt),
# a cloudflared konténer a belső hálón éri el a backendet: http://backend:8000.
# Így sem DNS-t, sem a töltők OCPP URL-jét nem kell átírni.
#
# Indítás a deploy/ mappából:
#   docker compose -f docker-compose.hetzner.yml up -d --build
# Kényelmesebb: export COMPOSE_FILE=docker-compose.hetzner.yml (a backup-db.sh is ezt használja)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocppuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ocpp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocppuser -d ocpp"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Csak localhostra, ellenőrzéshez (curl a szerveren). Publikusan a tunnel szolgálja ki.
    ports:
      - "127.0.0.1:8010:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend

volumes:
  pgdata:
