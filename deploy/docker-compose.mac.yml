# Mac mini (Colima) – a cloudflared terminálja a TLS-t, ezért nincs Caddy.
# A backend a HOSTON 127.0.0.1:8000-en hallgat, ezt szolgálja ki a cloudflared tunnel
# (pont mint a Raspin: cloudflared -> 127.0.0.1:8000 -> uvicorn).
#
# Indítás a deploy/ mappából:
#   docker compose -f docker-compose.mac.yml up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocppuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ocpp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocppuser -d ocpp"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
